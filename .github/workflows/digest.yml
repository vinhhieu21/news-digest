name: daily-news-digest

on:
  # The primary trigger is the news-digest-trigger Worker (apps/news-digest/trigger),
  # which dispatches this workflow at 09:00 ICT. GitHub's own schedule runs ~6h late,
  # so it is only a fallback for days the dispatch didn't happen or the run failed.
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        # Skip when another run on main today (ICT) succeeded or is still going.
        run: |
          today=$(TZ=Asia/Ho_Chi_Minh date +%F)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow digest.yml --branch main \
            --created ">=${today}T00:00:00+07:00" --json databaseId,status,conclusion \
            -q "[.[] | select(.databaseId != ${GITHUB_RUN_ID}) | select(.status != \"completed\" or .conclusion == \"success\")] | length")
          echo "other runs today: $n"
          echo "skip=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  run:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # Worst case is two buckets each walking the whole Gemini model list.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/news-digest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/news-digest/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Same group chat as spending-bot (apps/spending-bot/wrangler.toml).
          TELEGRAM_CHAT_ID: "-1001551080059"
          # Leave feed and model vars unset to use defaults in src/config.py.
          TOP_N: "7"
          LOOKBACK_HOURS: "24"
        run: python -m src.main

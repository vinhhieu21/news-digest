name: daily-news-digest

on:
  schedule:
    # 02:00 UTC == 09:00 Asia/Ho_Chi_Minh
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/news-digest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/news-digest/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Same group chat as spending-bot (apps/spending-bot/wrangler.toml).
          TELEGRAM_CHAT_ID: "-1001551080059"
          # Leave feed vars unset to use defaults in src/config.py.
          TOP_N: "7"
          GEMINI_MODEL: gemini-2.5-flash
          LOOKBACK_HOURS: "24"
        run: python -m src.main

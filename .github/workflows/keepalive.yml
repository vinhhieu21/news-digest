name: keepalive

# Prevents GitHub from auto-pausing the scheduled digest workflow after 60
# days of inactivity. Makes a no-op commit every ~6 weeks so the repo
# registers as active. Trivial cost, silent guarantee.

on:
  schedule:
    - cron: "0 3 1 */2 *"  # 03:00 UTC on day 1 of every 2nd month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No-op commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive ping" || exit 0
          git push

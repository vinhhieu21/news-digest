version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /apps/news-digest
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: [/apps/spending-bot, /apps/news-digest/trigger]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # @cloudflare/vitest-plugin only supports vitest 4; drop once it supports 5.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]

name = "spending-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[observability]
enabled = true

[vars]
# The group's chat id (negative number). Leave empty on first deploy, add the bot
# to the group, read the id from `wrangler tail`, then set it and deploy again.
ALLOWED_CHAT_ID = "-1001551080059"
# Bot username without "@", used to match `/cmd@BotName`.
BOT_USERNAME = "nth1bot"
# Workers AI model for expense categories and the monthly commentary. Empty = no LLM;
# the bot then works exactly as before, minus those two features.
LLM_MODEL = "@cf/aisingapore/gemma-sea-lion-v4-27b-it"

# Workers AI. Free plan: a daily allowance, after which calls fail (no charge) and the
# bot falls back: categories are retried by the next daily cron, commentary is skipped.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "spending-bot-db"
database_id = "a42ba259-a356-4391-96ed-9ca9da68cc61"
migrations_dir = "migrations"

[triggers]
# Cron runs in UTC; ICT = UTC+7.
# 21:00 ICT daily recap, 09:00 ICT on the 1st monthly summary.
crons = ["0 14 * * *", "0 2 1 * *"]
